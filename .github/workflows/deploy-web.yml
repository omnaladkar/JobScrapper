name: Deploy web on push

on:
  push:
    branches: [master]
    paths: ["product/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(npx -y vercel@latest deploy --prod --yes --force --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployed: $URL"
          npx -y vercel@latest alias set "$URL" product-gold-nu.vercel.app --token "$VERCEL_TOKEN"