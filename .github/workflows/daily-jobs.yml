name: Daily Job Scraper

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper and send email
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_TO: ${{ secrets.SENDGRID_TO }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
        run: python run_daily.py

      - name: Build live job feed (prune >7 days, export, freshness)
        run: |
          python scripts/build_live_feed.py

      - name: Persist scraper + feed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/seen_jobs.json data/last_snapshot.json output/ \
                      product/public/jobs.json product/public/jobs_freshness.json
          if git diff --cached --quiet; then
            echo "No changes to persist"
          else
            git commit -m "chore: update daily jobs feed [skip ci]"
            git pull --rebase origin master
            git push
          fi

      - name: Deploy the product to Vercel (optional)
        if: env.VERCEL_TOKEN != ''
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(npx vercel deploy --prod --yes --force --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployed: $URL"
          npx vercel alias set "$URL" product-gold-nu.vercel.app --token "$VERCEL_TOKEN"
