name: Daily Job Scraper

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper and send email
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_TO: ${{ secrets.SENDGRID_TO }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
        run: python run_daily.py

      - name: Persist seen jobs for dedup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/seen_jobs.json output/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to persist"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git pull --rebase origin master
            git push
          fi
